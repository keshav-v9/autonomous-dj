[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-dj"
version = "0.1.0"
description = "A deterministic audio foundation and operator console for an autonomous DJ."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
autonomous-dj = "autonomous_dj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

